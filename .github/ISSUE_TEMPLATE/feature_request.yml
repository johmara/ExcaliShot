name: Feature request
description: Suggest a new feature or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
      description: Describe what you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: How you imagine it working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms this matters for
      multiple: true
      options:
        - Linux (Wayland)
        - Linux (X11)
        - macOS
        - Windows
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would be willing to work on this (see CONTRIBUTING.md)
