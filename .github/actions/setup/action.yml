name: Set up build environment
description: System libraries, Node, Rust, caches and frontend dependencies, shared by CI and the release pipeline.

inputs:
  rust_targets:
    description: Extra Rust targets to install, comma separated (for the universal macOS build).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libxdo-dev \
          libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libpipewire-0.3-dev \
          libgbm-dev libxcb1-dev libxrandr-dev

    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.rust_targets }}

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri

    - name: Install frontend dependencies
      shell: bash
      run: npm ci

    # The Rust build embeds the built frontend, so it has to exist before cargo runs.
    # `npm run build` also type-checks the frontend.
    - name: Build frontend (type-check and bundle)
      shell: bash
      run: npm run build

    # Cargo.toml builds dependencies at opt-level 3 so image handling is fast in local dev
    # builds. Tests do not need that, and compile much faster without it. `cargo test`
    # compiles every target, so no separate `cargo check` is needed.
    - name: Rust unit tests
      shell: bash
      working-directory: src-tauri
      run: cargo test --locked --config 'profile.dev.package."*".opt-level=0'
