name: CI

# Runs on pull requests, and is called by release.yml before anything is published.
on:
  pull_request:
  workflow_call:
    inputs:
      os:
        description: JSON list of runner labels to test on
        type: string
        default: '["ubuntu-latest","macos-latest","windows-latest"]'

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os || '["ubuntu-latest","macos-latest","windows-latest"]') }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libpipewire-0.3-dev \
            libgbm-dev libxcb1-dev libxrandr-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # The Rust build embeds the built frontend, so it has to exist first.
      - name: Build frontend (type-check and bundle)
        run: npm run build

      # Cargo.toml builds dependencies at opt-level 3 so image handling is fast in local dev
      # builds. CI does not need that, and it compiles much faster without it. `cargo test`
      # already compiles every target, so no separate `cargo check` is needed.
      - name: Rust unit tests
        working-directory: src-tauri
        shell: bash
        run: cargo test --locked --config 'profile.dev.package."*".opt-level=0'
