name: CI

# Pull requests only. Pushes to main and release tags run the same checks inside
# release.yml, right before packaging.
on:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
