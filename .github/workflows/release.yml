name: Build and release

# pull request       -> build and test on Linux, macOS and Windows (nothing is published)
# push to main       -> the same, then a GitHub pre-release  v<version>-rc.<run number>
# push of tag vX.Y.Z -> the same, then a GitHub release      vX.Y.Z, and main is bumped to the next
#                       patch version (rc tags such as v0.1.1-rc.3 do not match the pattern below)
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Work out version and tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed to check that a release tag is on main

      - name: Check versions and choose the tag
        id: v
        run: |
          set -euo pipefail
          version=$(jq -r .version src-tauri/tauri.conf.json)
          npm_version=$(jq -r .version package.json)
          crate_version=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')
          if [ "$version" != "$npm_version" ] || [ "$version" != "$crate_version" ]; then
            echo "::error::Version mismatch: tauri.conf.json=$version package.json=$npm_version Cargo.toml=$crate_version"
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            if [ "$tag" != "v${version}" ]; then
              echo "::error::Tag $tag does not match the app version $version. Tag the commit that carries version $version."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag $tag is not on main. Releases must be tagged on a commit that is part of main."
              exit 1
            fi
            prerelease=false
          else
            tag="v${version}-rc.${GITHUB_RUN_NUMBER}"
            prerelease=true
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${tag} (prerelease=${prerelease})"

  build:
    name: Build (${{ matrix.name }})
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu, so the .deb and AppImage run on as many distros as possible.
          - name: Linux
            os: ubuntu-22.04
            args: ""
            rust_targets: ""
          - name: macOS (universal)
            os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libpipewire-0.3-dev \
            libgbm-dev libxcb1-dev libxrandr-dev

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # The Rust build embeds the built frontend, so it has to exist before cargo runs.
      # This also type-checks the frontend.
      - name: Build frontend (type-check and bundle)
        run: npm run build

      # Cargo.toml builds dependencies at opt-level 3 so image handling is fast in local dev
      # builds. Tests do not need that and compile much faster without it. `cargo test` compiles
      # every target, so no separate `cargo check` is needed. If this fails, nothing is packaged.
      - name: Rust unit tests
        working-directory: src-tauri
        shell: bash
        run: cargo test --locked --config 'profile.dev.package."*".opt-level=0'

      - name: Package and publish
        if: github.event_name != 'pull_request'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts. The matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseName: ExcaliShot ${{ needs.prepare.outputs.tag }}
          releaseBody: ${{ needs.prepare.outputs.prerelease == 'true' && format('Release candidate built from `main` at {0}. Not for general use; install the release instead.', github.sha) || 'Install the package for your platform below. The builds are not code-signed yet, so macOS and Windows will show a warning on first launch.' }}
          releaseDraft: false
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          args: ${{ matrix.args }}

  # After a real release, move main on to the next patch version so the next rc builds
  # are labelled for the upcoming release. Pushes made with GITHUB_TOKEN do not start new
  # workflow runs, so this does not trigger another rc build.
  bump:
    name: Bump main to the next version
    if: github.ref_type == 'tag'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Bump to the next patch version
        env:
          RELEASED: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          current=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$current" != "$RELEASED" ]; then
            echo "main is already at $current, nothing to bump"
            exit 0
          fi

          IFS=. read -r major minor patch <<< "$RELEASED"
          next="${major}.${minor}.$((patch + 1))"

          # tauri.conf.json and Cargo.toml: first version entry only (sed keeps the diff minimal)
          sed -i -E '0,/"version": *"[^"]*"/s//"version": "'"$next"'"/' src-tauri/tauri.conf.json
          sed -i -E '0,/^version = "[^"]*"/s//version = "'"$next"'"/' src-tauri/Cargo.toml
          # package.json and package-lock.json
          npm version "$next" --no-git-tag-version
          # Cargo.lock must match, or `cargo --locked` fails in CI
          NEXT="$next" perl -0pi -e 's/(name = "excalishot-app"\nversion = ")[^"]+(")/$1$ENV{NEXT}$2/' src-tauri/Cargo.lock

          # Refuse to push a half-applied bump.
          for v in "$(jq -r .version src-tauri/tauri.conf.json)" "$(jq -r .version package.json)" \
                   "$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')" \
                   "$(grep -A1 '^name = "excalishot-app"' src-tauri/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')"; do
            if [ "$v" != "$next" ]; then
              echo "::error::Version bump left a file at $v instead of $next"
              exit 1
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bump version to ${next} after v${RELEASED} release"
          git pull --rebase origin main
          git push origin main
