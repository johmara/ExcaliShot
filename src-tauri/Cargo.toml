[package]
name = "excalishot-app"
version = "0.1.1"
description = "Screenshots with Excalidraw annotation"
authors = ["Johan Martinson"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "excalishot_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
chrono = "0.4.45"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-updater = "2.14.1"
minisign-verify = "0.3.0"
base64 = "0.23.1"
tauri-plugin-notification = "2.8.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }


# Dependencies (image decoding/encoding in particular) are unusably slow unoptimized, which made
# dev builds feel laggy. Our own code stays at the default dev level for fast rebuilds.
[profile.dev.package."*"]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Linux: Wayland-capable screenshot and global shortcuts through xdg-desktop-portal.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
ashpd = { version = "0.14.0", default-features = false, features = ["global_shortcuts", "screenshot", "tokio"] }
futures-util = "0.3.34"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-global-shortcut = "2.4.1"
xcap = "0.9.10"

# macOS and Windows: `xcap` and `tauri-plugin-global-shortcut` are added with
# `cargo add ... --target 'cfg(any(target_os = "macos", target_os = "windows"))'`.
